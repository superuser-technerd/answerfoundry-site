<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Operator dashboard | AnswerFoundry</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
:root{
  --ink:#101828;--slate:#475467;--mist:#98a2b3;--line:#e6e9f0;
  --paper:#ffffff;--fog:#f7f8fb;--forge:#e8590c;--forge-dk:#c2410c;
  --ember:#fff3ec;--navy:#0b1b34;--navy2:#12294d;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--paper);line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:50}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-size:1.25rem;font-weight:800;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.logo span{color:var(--forge)}
.nav-links{display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.nav-links a{color:var(--slate);text-decoration:none;font-size:.92rem;font-weight:500}
.nav-links a:hover{color:var(--ink)}
.btn{display:inline-block;background:var(--forge);color:#fff;padding:12px 22px;border-radius:8px;font-weight:700;text-decoration:none;font-size:.95rem;transition:background .15s}
.btn:hover{background:var(--forge-dk)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--mist);background:var(--fog)}
.hero{background:linear-gradient(180deg,var(--fog) 0%,#fff 100%);padding:88px 0 72px;text-align:center}
.kicker{display:inline-block;background:var(--ember);color:var(--forge-dk);font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border-radius:99px;margin-bottom:22px}
h1{font-size:clamp(2rem,5vw,3.1rem);line-height:1.12;letter-spacing:-.03em;font-weight:800;max-width:780px;margin:0 auto 20px}
h1 em{font-style:normal;color:var(--forge)}
.sub{font-size:1.15rem;color:var(--slate);max-width:640px;margin:0 auto 34px}
.hero-ctas{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.hero-note{margin-top:16px;font-size:.85rem;color:var(--mist)}
section{padding:72px 0}
.section-kick{color:var(--forge);font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
h2{font-size:clamp(1.5rem,3.4vw,2.1rem);letter-spacing:-.02em;font-weight:800;margin-bottom:14px}
.lead{color:var(--slate);max-width:680px;font-size:1.05rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;margin-top:44px}
.card{border:1px solid var(--line);border-radius:14px;padding:30px;background:#fff;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 12px 32px rgba(16,24,40,.08);transform:translateY(-2px)}
.icon{width:44px;height:44px;border-radius:10px;background:var(--ember);display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-bottom:18px}
.card h3{font-size:1.12rem;margin-bottom:10px;letter-spacing:-.01em}
.card p{color:var(--slate);font-size:.95rem}
.callout{background:var(--fog);border:1px solid var(--line);border-radius:14px;padding:24px 28px;margin-top:30px;font-size:.95rem;color:var(--slate)}
.callout strong{color:var(--ink)}
.formsec{background:var(--fog)}
.form-wrap{max-width:640px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:40px;box-shadow:0 12px 32px rgba(16,24,40,.06)}
.form-field{margin-bottom:18px}
.form-field label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px;color:var(--ink)}
.form-field input,.form-field select,.form-field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:.95rem;font-family:inherit;color:var(--ink);background:#fff}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:none;border-color:var(--forge)}
.form-field textarea{resize:vertical}
.optional-tag{color:var(--mist);font-weight:500;font-size:.8rem}
.form-wrap button{width:100%;background:var(--forge);color:#fff;border:none;padding:14px 22px;border-radius:8px;font-weight:700;font-size:1rem;cursor:pointer;transition:background .15s;margin-top:8px}
.form-wrap button:hover{background:var(--forge-dk)}
.trust-note{max-width:640px;margin:18px auto 0;font-size:.85rem;color:var(--mist);text-align:center}
.disclaimer{font-size:.82rem;color:var(--mist);max-width:760px;margin:0 auto;text-align:center}
.final{background:var(--navy);text-align:center;color:#fff}
.final h2{color:#fff}
.final p{color:#b9c4d8;max-width:560px;margin:0 auto 30px}
footer{background:#0a1526;color:#8fa0ba;padding:44px 0;font-size:.85rem}
.foot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
footer a{color:#c4cfe0;text-decoration:none}
footer a:hover{color:#fff}
@media(max-width:720px){.nav-links a:not(.btn){display:none}.form-wrap{padding:28px 22px}}
.foot-legal{display:inline-block;margin-top:8px;color:#6d7f99}
.consent-label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:400!important;font-size:.86rem;line-height:1.5;color:var(--slate)}
.consent-label input[type=checkbox]{width:auto!important;flex:0 0 auto;margin-top:3px}
.consent-label strong{color:var(--ink)}
#phone-consent-field{background:var(--fog);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.submit-legal{margin-top:14px;font-size:.8rem;line-height:1.55;color:var(--mist)}
.submit-legal a{color:var(--forge-dk);font-weight:600;text-decoration:none}
.submit-legal a:hover{text-decoration:underline}

/* --- added 2026-08-08: accessibility + legal page furniture --- */
.skip{position:absolute;left:-9999px;top:0;background:var(--ink);color:#fff;padding:12px 18px;z-index:100;text-decoration:none;border-radius:0 0 8px 0;font-weight:700}
.skip:focus{left:0}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #0b57d0;outline-offset:2px;border-radius:3px}
.legal .meta{background:var(--fog);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 28px}
.legal .meta p{margin:0 0 6px;font-size:.92rem}
.legal .meta p:last-child{margin-bottom:0}
.legal .callout{border-left:4px solid var(--forge);background:var(--ember);padding:14px 18px;border-radius:0 10px 10px 0;margin:22px 0}
.legal .callout p{margin-bottom:10px}
.legal .callout p:last-child{margin-bottom:0}
.legal .toc{background:var(--fog);border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin:0 0 32px}
.legal .toc h2{border:0;margin:0 0 8px;padding:0;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--slate)}
.legal .toc ol{margin:0 0 0 20px}
.legal .toc li{margin-bottom:4px}
.legal .table-wrap{overflow-x:auto;margin:18px 0}
.legal caption{text-align:left;font-weight:700;color:var(--ink);padding-bottom:8px;font-size:.95rem}
.legal code{background:var(--fog);padding:2px 6px;border-radius:4px;font-size:.9em}
.legal h2{scroll-margin-top:80px}
.hero .emblem{display:block;margin:0 auto 20px}
.lcards{list-style:none;margin:0 0 34px;padding:0}
.lcards li{display:flex;gap:16px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:14px;background:#fff;transition:box-shadow .15s,transform .15s}
.lcards li:hover{box-shadow:0 12px 32px rgba(16,24,40,.08);transform:translateY(-2px)}
.lcards h2{margin:0 0 4px!important;font-size:1.08rem}
.lcards p{margin:0;font-size:.95rem}
.card-ico{width:28px;height:28px;flex:0 0 auto;margin-top:3px;color:var(--forge)}
.consent-box{display:none;border:1px solid var(--line);background:var(--fog);border-radius:10px;padding:14px 16px;margin:0 0 18px}
.consent-box.is-visible{display:block}
.form-err{color:#b42318;font-weight:600;font-size:.88rem;margin:8px 0 0}
.agree-line{font-size:.88rem;color:var(--slate);margin:14px 0 0}
.agree-line a{color:var(--forge-dk);font-weight:600}
.optional-tag{font-weight:400;color:var(--mist);font-size:.85em}
@media (forced-colors:active){.card-ico{color:CanvasText}}

.wrapa{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
.gate{max-width:420px;margin:80px auto}
.gate input{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:inherit;font-size:.95rem}
.gate button{width:100%;margin-top:10px;background:var(--forge);color:#fff;border:0;padding:13px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
.gate button:hover{background:var(--forge-dk)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:0 0 26px}
.kpi{background:var(--fog);border:1px solid var(--line);border-top:3px solid var(--forge);border-radius:10px;padding:16px 14px;text-align:center}
.kpi b{display:block;font-size:1.7rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi span{display:block;font-size:.76rem;color:var(--slate);margin-top:6px}
table.jobs{width:100%;border-collapse:collapse;font-size:.88rem}
table.jobs th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mist);
  font-weight:800;border-bottom:1.5px solid var(--ink);padding:9px 10px}
table.jobs td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--slate)}
table.jobs tr:hover td{background:var(--fog)}
.pill{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:99px}
.p-done{background:#e7f5ee;color:#1e6b47}.p-run{background:var(--ember);color:var(--forge-dk)}
.p-fail{background:#fdeceb;color:#a3251c}.p-due{background:#eef2ff;color:#3730a3}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.8rem}
.act{background:transparent;border:1.5px solid var(--line);border-radius:7px;padding:6px 11px;font:inherit;
  font-size:.8rem;font-weight:700;cursor:pointer;color:var(--ink)}
.act:hover{border-color:var(--mist);background:var(--fog)}
.act[disabled]{opacity:.5;cursor:default}
.msg{font-size:.88rem;color:var(--slate);margin:14px 0}
.msg.err{color:#b42318}
.empty{background:var(--fog);border:1px solid var(--line);border-radius:12px;padding:34px;text-align:center;color:var(--slate)}
h1.dash{font-size:1.5rem;letter-spacing:-.02em;margin:0 0 6px}
.sub2{color:var(--slate);font-size:.92rem;margin:0 0 26px}
</style>
</head>
<body>

<div class="wrapa">
  <div id="gate" class="gate">
    <h1 class="dash">Operator dashboard</h1>
    <p class="sub2">Paste your admin token. It's held in this tab only &mdash; never in the URL, never stored on disk.</p>
    <input id="tok" type="password" placeholder="ADMIN_TOKEN" autocomplete="off">
    <button id="go">Unlock</button>
    <p class="msg" id="gate-msg"></p>
  </div>

  <div id="app" hidden>
    <h1 class="dash">Operator dashboard</h1>
    <p class="sub2">Every audit this site has run. Source of truth is blob storage, not this page.</p>
    <div class="cards" id="kpis"></div>
    <div id="list"></div>
    <p class="msg" id="msg"></p>
  </div>
</div>


<script>
(function(){
  var tok = sessionStorage.getItem('af_admin') || '';
  var gate = document.getElementById('gate'), app = document.getElementById('app');
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

  function api(payload){
    return fetch('/api/admin-jobs',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({adminToken:tok},payload))})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); });
  }

  document.getElementById('go').addEventListener('click',function(){
    tok = document.getElementById('tok').value.trim();
    if(!tok) return;
    document.getElementById('gate-msg').textContent = 'Checking\u2026';
    api({action:'list'}).then(function(res){
      if(!res.ok||!res.j.ok){
        document.getElementById('gate-msg').className='msg err';
        document.getElementById('gate-msg').textContent = res.j.error || 'That token was rejected.';
        return;
      }
      sessionStorage.setItem('af_admin',tok);
      gate.hidden=true; app.hidden=false; paint(res.j);
    });
  });
  document.getElementById('tok').addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('go').click(); });

  function paint(d){
    var c = d.counts;
    document.getElementById('kpis').innerHTML =
      [['Total audits',c.total],['Delivered',c.done],['In flight',c.running],
       ['Failed',c.failed],['Due for re-test',c.dueForRetest]]
      .map(function(k){ return '<div class="kpi"><b>'+k[1]+'</b><span>'+k[0]+'</span></div>'; }).join('');

    if(!d.jobs.length){
      document.getElementById('list').innerHTML =
        '<div class="empty"><strong>No audits yet.</strong><br>The first paid onboarding will appear here automatically.</div>';
      return;
    }
    var rows = d.jobs.map(function(j){
      var pill = j.stage==='done' ? '<span class="pill p-done">delivered</span>'
               : j.stage==='failed' ? '<span class="pill p-fail">failed</span>'
               : '<span class="pill p-run">'+esc(j.stage)+'</span>';
      var due = j.dueForRetest ? ' <span class="pill p-due">re-test due</span>' : '';
      return '<tr>'+
        '<td><strong>'+esc(j.business||'—')+'</strong><br><span class="mono">'+esc(j.ref)+'</span></td>'+
        '<td>'+pill+due+'</td>'+
        '<td>'+esc(j.tier||'—')+'<br><span style="color:var(--mist)">cycle '+(j.cycles||1)+'</span></td>'+
        '<td>'+(j.score!=null?'<strong>'+j.score+'</strong>/100':'—')+'</td>'+
        '<td>'+(j.findings!=null?j.findings:'—')+'</td>'+
        '<td>'+(j.runs!=null?j.runs:'—')+'</td>'+
        '<td>'+(j.pages!=null?j.pages:'—')+'</td>'+
        '<td>'+esc((j.lastCycleAt||j.updatedAt||'').slice(0,10))+'</td>'+
        '<td>'+(j.reportPath?'<a href="'+esc(j.reportPath)+'" target="_blank">report</a>':'—')+'</td>'+
        '<td>'+(j.stage==='done'?'<button class="act" data-retest="'+esc(j.ref)+'">Re-test</button>':'')+'</td>'+
      '</tr>';
    }).join('');
    document.getElementById('list').innerHTML =
      '<table class="jobs"><tr><th>Business</th><th>Status</th><th>Plan</th><th>Score</th><th>Findings</th>'+
      '<th>Runs</th><th>Pages</th><th>Last cycle</th><th></th><th></th></tr>'+rows+'</table>';

    Array.prototype.forEach.call(document.querySelectorAll('[data-retest]'),function(btn){
      btn.addEventListener('click',function(){
        var ref = btn.getAttribute('data-retest');
        if(!confirm('Re-run the identical prompt set for '+ref+'?\n\nThis spends API credit and emails the client when it finishes.')) return;
        btn.disabled = true; btn.textContent = 'Starting\u2026';
        api({action:'retest',ref:ref}).then(function(res){
          var m = document.getElementById('msg');
          if(res.ok && res.j.started){ m.className='msg'; m.textContent='Re-test started for '+ref+'. It runs in the background and emails on completion. Refresh in a few minutes.'; btn.textContent='Running'; }
          else { m.className='msg err'; m.textContent='Could not start the re-test for '+ref+'.'; btn.disabled=false; btn.textContent='Re-test'; }
        });
      });
    });
  }

  if(tok){
    api({action:'list'}).then(function(res){
      if(res.ok&&res.j.ok){ gate.hidden=true; app.hidden=false; paint(res.j); }
      else sessionStorage.removeItem('af_admin');
    });
  }
})();
</script>

</body>
</html>
